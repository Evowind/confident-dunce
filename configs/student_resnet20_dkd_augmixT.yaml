# Meme student DKD, mais distille depuis le teacher AugMix (H4).
# Student par DKD (Zhao et al. 2022). Hyperparametres du papier pour wrn40_2 -> resnet : alpha 1, beta 8, T 4.
name: student_resnet20_dkd_augmixT
model: resnet20
teacher_ckpt: runs/teacher_wrn40_2_augmix/best.pt
epochs: 240
batch_size: 64
lr: 0.05
weight_decay: 0.0005
augmix: false
seed: 0
schedule: {type: multistep, milestones: [150, 180, 210], gamma: 0.1}
kd:
  method: dkd
  temperature: 4.0
  ce_weight: 1.0
  alpha: 1.0
  beta: 8.0
  warmup_epochs: 20
